<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Photo Editor</h1>
  <button id="openBtn">Open image</button>
  <button id="resetBtn" disabled>Reset all</button>
  <input type="file" id="file" accept="image/*" hidden>
</header>

<main>
  <section id="stage" aria-label="Preview">
    <div id="drop">
      <strong>Drop a photo here</strong>
      or use Open image. Your photo stays in your browser.
      <br><button id="openBtn2" class="primary">Open image</button>
    </div>
    <canvas id="view"></canvas>
    <button id="compare" title="Hold to see the original">Hold to compare</button>
    <div id="info"></div>
  </section>

  <aside>
    <nav role="tablist" aria-label="Editing tools">
      <button role="tab" aria-selected="true" data-tab="adjust">Adjust</button>
      <button role="tab" aria-selected="false" data-tab="orient">Orient</button>
      <button role="tab" aria-selected="false" data-tab="looks">Looks</button>
      <button role="tab" aria-selected="false" data-tab="export">Export</button>
    </nav>

    <div class="panel show" id="tab-adjust"></div>

    <div class="panel" id="tab-orient">
      <h2>Rotate and flip</h2>
      <div class="group">
        <button id="rotL">Rotate left</button>
        <button id="rotR">Rotate right</button>
        <button id="flipH">Flip horizontal</button>
        <button id="flipV">Flip vertical</button>
      </div>
      <div class="row">
        <label for="straighten">Straighten <output id="straightenOut">0°</output></label>
        <input type="range" id="straighten" min="-15" max="15" step="0.1" value="0">
      </div>
      <h2>Crop</h2>
      <div class="group" id="aspects">
        <button data-aspect="0" class="active">Original</button>
        <button data-aspect="1">1:1</button>
        <button data-aspect="1.3333">4:3</button>
        <button data-aspect="1.5">3:2</button>
        <button data-aspect="1.7778">16:9</button>
        <button data-aspect="0.8">4:5</button>
      </div>
      <p class="hint">Crops are centered. Straighten zooms in slightly so no empty corners show.</p>
    </div>

    <div class="panel" id="tab-looks">
      <div id="looks"></div>
    </div>

    <div class="panel" id="tab-export">
      <div class="row">
        <label for="format">Format</label>
        <select id="format">
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>
      <div class="row" id="qualityRow">
        <label for="quality">Quality <output id="qualityOut">92</output></label>
        <input type="range" id="quality" min="40" max="100" step="1" value="92">
      </div>
      <p class="hint" id="sizeHint">Exports at the original resolution.</p>
    </div>

    <div class="foot">
      <button id="downloadBtn" class="primary" disabled>Download</button>
    </div>
  </aside>
</main>

<script src="script.js"></script>
</body>
</html>
